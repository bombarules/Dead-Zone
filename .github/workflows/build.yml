name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components (API 36, build-tools 36.1.0, NDK r29)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "platform-tools" "ndk;29.0.14206865"

      - name: Download Godot 4.6.3
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install Godot export templates
        run: |
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable" tpz
          unzip -q templates.tpz -d tpz
          cp -a tpz/templates/. "$HOME/.local/share/godot/export_templates/4.6.3.stable/"

      - name: Point Godot at the JDK and Android SDK
        run: |
          "$GODOT" --headless --editor --quit --path . || true
          SETTINGS="$HOME/.config/godot/editor_settings-4.6.tres"
          sed -i "s|^export/android/java_sdk_path = .*|export/android/java_sdk_path = \"$JAVA_HOME\"|" "$SETTINGS"
          grep -q '^export/android/java_sdk_path' "$SETTINGS" || echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$SETTINGS"
          sed -i "s|^export/android/android_sdk_path = .*|export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"|" "$SETTINGS"
          grep -q '^export/android/android_sdk_path' "$SETTINGS" || echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" >> "$SETTINGS"
          grep "export/android" "$SETTINGS" || true

      - name: Enable ETC2/ASTC texture imports (required for Android exports)
        run: |
          python3 - <<'PY'
          p = 'project.godot'
          s = open(p).read()
          if 'import_etc2_astc' not in s:
              s = s.replace('[rendering]\n', '[rendering]\n\ntextures/vram_compression/import_etc2_astc=true\n', 1)
              open(p, 'w').write(s)
          print('import_etc2_astc present:', 'import_etc2_astc=true' in open(p).read())
          PY

      - name: Generate a debug keystore for signing
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Import the project
        run: '"$GODOT" --headless --path . --import'

      - name: Export the Android APK
        run: |
          mkdir -p build
          "$GODOT" --headless --path . --install-android-build-template --export-release "Android" "$PWD/build/Bombies-Dead-Zone.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Bombies-Dead-Zone-APK
          path: build/Bombies-Dead-Zone.apk
